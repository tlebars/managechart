# Production stack.
# Run from the repository root:
#   docker compose -f docker/compose.yaml --env-file docker/.env up -d --build
name: managechart

services:
  managechart:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APP_ENV: ${APP_ENV:-prod}
        RUN_TYPE: build
    image: managechart:latest
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:84:8080"
    environment:
      APP_ENV: ${APP_ENV:-prod}
      APP_DEBUG: ${APP_DEBUG:-0}
      APP_SECRET: ${APP_SECRET:?APP_SECRET is required}
      # POSTGRES_PASSWORD must be URL-safe (or percent-encoded) because it is embedded in this URL.
      DATABASE_URL: "postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required}?serverVersion=16&charset=utf8"
      MAILER_DSN: ${MAILER_DSN:-null://null}
      MAILER_FROM: ${MAILER_FROM:-webmaster@managechart.org}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    volumes:
      - ./secrets/iv.txt:/app/managechart/Resources/privateKey/iv.txt:ro
      - ./secrets/key.txt:/app/managechart/Resources/privateKey/key.txt:ro
    networks:
      - frontend
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/apache2:uid=33,gid=33
      - /var/lock/apache2:uid=33,gid=33
      - /app/managechart/var:uid=33,gid=33
    mem_limit: 512m
    pids_limit: 200
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
    restart: unless-stopped

volumes:
  db_data:

networks:
  frontend:
  backend:
    internal: true
