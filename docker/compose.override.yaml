# Development overrides. Combine explicitly with the production file:
#   docker compose -f docker/compose.yaml -f docker/compose.override.yaml --env-file docker/.env up -d --build
services:
  managechart:
    build:
      args:
        APP_ENV: dev
        RUN_TYPE: dev
    environment:
      APP_ENV: dev
      APP_DEBUG: "1"
      RUN_TYPE: dev

  db:
    ports:
      - "127.0.0.1:5432:5432"

networks:
  backend:
    internal: false
